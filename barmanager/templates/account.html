{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block main_class %}medium{% endblock %}
{% block content %}
<div class="pagehead"><h1>Account</h1></div>
<p>Ingelogd als <b>{{ user.username }}</b>{% if user.is_admin %} (beheerder){% endif %}.</p>

<h2>Wachtwoord wijzigen</h2>
<form method="post" action="/account/wachtwoord" class="panel stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Huidig wachtwoord <input name="current" type="password" autocomplete="current-password" required></label>
  <div class="grid2">
    <label>Nieuw wachtwoord <input name="new" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Herhaal <input name="repeat" type="password" minlength="8" autocomplete="new-password" required></label>
  </div>
  <div class="row"><button>Wijzigen</button></div>
</form>
<p class="muted small">BarManager {{ version }}</p>
{% endblock %}
