[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barmanager"
version = "0.6.5"
description = "Drankvoorraad per locatie bijhouden door barcodes te scannen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.4",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
barmanager = "barmanager.app:main"

[tool.setuptools.packages.find]
include = ["barmanager*"]

[tool.setuptools.package-data]
"barmanager" = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
