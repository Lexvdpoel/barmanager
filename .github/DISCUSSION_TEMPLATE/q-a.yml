body:
  - type: markdown
    attributes:
      value: |
        Ask anything about installing or using BarManager. Search first; your question may already have an
        answer. Found a bug? Please open a bug report instead.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What do you want to do, and what did you try?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BarManager version
      description: The bottom of the Account page shows it.
      placeholder: "0.7.0"
  - type: dropdown
    id: setup
    attributes:
      label: How do you run it?
      options:
        - Docker on a Raspberry Pi (arm64)
        - Docker on a server or NAS (amd64)
        - Running from source
        - Not installed yet
        - Other
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Your docker-compose.yml (without passwords), reverse proxy, screenshots or log lines.
