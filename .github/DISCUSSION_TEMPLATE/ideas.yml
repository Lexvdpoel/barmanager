title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Suggest a feature or an improvement. Upvote the ideas you would like to see too; the most wanted
        ones are picked up first.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should BarManager do, and what would you use it for?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How do you do it now?
      description: A workaround, another app, a spreadsheet, or not at all.
  - type: textarea
    id: example
    attributes:
      label: Examples or sketches
      description: Pictures, links or a sketch of what you have in mind.
