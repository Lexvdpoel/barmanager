name: site

# barmanager.club: the Cloudflare Worker "barmanager" serves site/public as static files.
# Deploys when the site changes on main, or by hand (Actions > site > Run workflow).
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on the account,
# Workers Routes: Edit + DNS: Edit on the zone barmanager.club) and the repository
# variable CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN secret yet, the site is not deployed."
            exit 0
          fi
          npx --yes wrangler@4.165.0 deploy
