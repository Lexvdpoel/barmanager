# Compose set-up for an ordinary Docker host.
# Put a reverse proxy with TLS in front of it (Nginx Proxy Manager, Caddy, Traefik, ...): the camera
# scanner in the browser only works over https.

services:
  barmanager:
    image: ghcr.io/lexvdpoel/barmanager:latest
    container_name: barmanager
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      # First administrator (only used while the database is still empty).
      - BM_ADMIN_USERNAME=admin
      - BM_ADMIN_PASSWORD=change-me
      # Optional: your own SearXNG for free web search (switch on 'json' in search.formats).
      # - BM_SEARXNG_URL=http://searxng:8080
      # Optional: a Brave Search API key instead of SearXNG.
      # - BM_BRAVE_API_KEY=
      # Optional: local AI that fills in missing details (see the ollama service below).
      # - BM_OLLAMA_URL=http://ollama:11434
    volumes:
      - ./appdata/barmanager:/config
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Optional: local AI (qwen3:4b by default) that fills in brand, country, alcohol and description.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   volumes:
  #     - ./appdata/ollama:/root/.ollama
  #   restart: unless-stopped

  # Optional: web search for unknown barcodes, product photos and sources for the AI.
  # searxng:
  #   image: searxng/searxng:latest
  #   container_name: searxng
  #   volumes:
  #     - ./appdata/searxng:/etc/searxng
  #   restart: unless-stopped
